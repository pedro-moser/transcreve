[project]
name = "transcreve"
version = "2.1.0b1"
description = "Ferramenta de transcrição musical com waveform, loop A-B, controle de velocidade e seções"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.2",
    "numpy==1.26.4",
    "soundfile==0.14.0",
    "sounddevice==0.5.6",
    "pyrubberband==0.4.0",
    "pyqtgraph==0.14.0",
    "yt-dlp==2026.8.19",
    "platformdirs==4.11.11",
]

[project.scripts]
transcreve = "main:main"
