publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.42
  just_audio_media_kit: ^2.1.0
  media_kit: ^1.2.0
