[project]
name = "transcreve"
version = "2.0.0"
description = "Ferramenta de transcrição musical com waveform, loop A-B, controle de velocidade e seções"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "numpy",
    "soundfile",
    "sounddevice",
    "pyrubberband",
    "pyqtgraph",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
transcreve = "main:main"
